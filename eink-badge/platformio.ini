; E-Ink Badge Platform Configuration
; ESP32-S3 with ePaper, Touch, DFPlayer Mini, BLE

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

lib_deps =
    zinggjm/GxEPD2@^1.6.0
    bblanchon/ArduinoJson@^7.0.0
    piervsvi/ESP32 BLE Arduino@^2.0.0
   WiFiManager=https://github.com/tzapu/WiFiManager/archive/refs/heads/master.zip

; Upload method (use for OTA later)
; upload_protocol = espota
; upload_port = badge.local
